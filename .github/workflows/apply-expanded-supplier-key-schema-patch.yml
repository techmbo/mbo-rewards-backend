name: Apply Expanded Supplier Runtime Patch

on:
  push:
    branches:
      - fix/mbo-rewards-backend-final-corrections
    paths:
      - 'scripts/apply-expanded-supplier-key-schema-patch.mjs'
      - 'scripts/apply-admitad-sync-wiring-patch.mjs'
      - '.github/workflows/apply-expanded-supplier-key-schema-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/mbo-rewards-backend-final-corrections
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic SupplierKey enum patch
        run: node scripts/apply-expanded-supplier-key-schema-patch.mjs
      - name: Apply deterministic Admitad sync wiring patch
        run: node scripts/apply-admitad-sync-wiring-patch.mjs
      - name: Commit runtime updates
        run: |
          if git diff --quiet -- prisma/schema.prisma src/jobs/sync.job.js; then
            echo "Expanded supplier runtime already applied; nothing to commit."
            exit 0
          fi
          git config user.name "MBO Group"
          git config user.email "tech@marketingblueocean.com"
          git add prisma/schema.prisma src/jobs/sync.job.js
          git commit -m "Wire Admitad runtime and expand supplier enum"
          git push origin HEAD:fix/mbo-rewards-backend-final-corrections
