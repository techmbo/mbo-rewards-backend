name: Apply Client Commercial Persistence Patch

on:
  push:
    branches:
      - fix/mbo-rewards-backend-final-corrections
    paths:
      - 'scripts/apply-client-commercial-schema-patch.mjs'
      - 'scripts/apply-client-commercial-service-patch.mjs'
      - 'scripts/apply-financial-transaction-runtime-patch.mjs'
      - 'scripts/apply-finance-safety-hardening-patch.mjs'
      - '.github/workflows/apply-client-commercial-schema-patch.yml'

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/mbo-rewards-backend-final-corrections
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic Prisma schema patch
        run: node scripts/apply-client-commercial-schema-patch.mjs
      - name: Apply deterministic commercial service patch
        run: node scripts/apply-client-commercial-service-patch.mjs
      - name: Apply deterministic finance runtime patch
        run: node scripts/apply-financial-transaction-runtime-patch.mjs
      - name: Apply finance safety hardening patch
        run: node scripts/apply-finance-safety-hardening-patch.mjs
      - name: Commit persistence integration updates
        run: |
          if git diff --quiet -- prisma/schema.prisma src/modules/commercial/services/commercial.service.js src/modules/commercial/services/clientCommercialRuntime.service.js src/modules/commercial/commercialRuleEngine.js src/modules/finance/financialTransaction.service.js src/modules/finance/reconciliation.service.js src/modules/finance/financeSeparation.contract.js src/modules/finance/reconciliationLogic.contract.js src/modules/order/paymentState.service.js; then
            echo "Client commercial and finance runtime integration already applied; nothing to commit."
            exit 0
          fi
          git config user.name "MBO Group"
          git config user.email "tech@marketingblueocean.com"
          git add prisma/schema.prisma src/modules/commercial/services/commercial.service.js src/modules/commercial/services/clientCommercialRuntime.service.js src/modules/commercial/commercialRuleEngine.js src/modules/finance/financialTransaction.service.js src/modules/finance/reconciliation.service.js src/modules/finance/financeSeparation.contract.js src/modules/finance/reconciliationLogic.contract.js src/modules/order/paymentState.service.js
          git commit -m "Harden reconciliation evidence and client payment release"
          git push origin HEAD:fix/mbo-rewards-backend-final-corrections
