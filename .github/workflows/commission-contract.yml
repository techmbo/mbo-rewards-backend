name: Commission Contract

on:
  push:
    branches:
      - fix/mbo-rewards-backend-final-corrections
    paths:
      - 'src/adapters/**'
      - 'src/modules/commercial/**'
      - 'src/modules/finance/**'
      - 'src/modules/order/orderMerge.js'
      - 'src/modules/order/orderStatusNormalization.contract.js'
      - 'src/modules/order/paymentState.service.js'
      - 'src/modules/ops/campaignCommissions.js'
      - 'src/modules/networkOps/campaignCommissionSummary.contract.js'
      - 'test/admitadAdapter.test.js'
      - 'test/campaignCommissions.test.js'
      - 'test/clientCommercialMatcher.test.js'
      - 'test/clientCommercialCalculation.test.js'
      - 'test/clientCommercialRuntime.service.test.js'
      - 'test/clientCommercialSchemas.test.js'
      - 'test/financeSeparation.test.js'
      - 'test/networkRegistryCoverage.test.js'
      - 'test/orderStatusApprovalSafety.test.js'
      - 'test/paymentStateFinanceSafety.test.js'
      - 'test/reconciliationEvidenceSafety.test.js'
      - 'test/reconciliationLogic.test.js'
      - 'test/p40.campaignCommissionSummary.test.js'
      - 'test/supplierCommissionArchitecture.contract.test.js'
      - 'test/supplierCommissionMatcher.test.js'
      - 'test/supplierCommissionRule.test.js'
      - 'test/supplierCommissionRuleService.test.js'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260902010000_supplier_commission_conditions/**'
      - 'prisma/migrations/20260902170000_client_commercial_runtime/**'
      - '.github/workflows/commission-contract.yml'
  pull_request:
    branches: [backend1]
    paths:
      - 'src/adapters/**'
      - 'src/modules/commercial/**'
      - 'src/modules/finance/**'
      - 'src/modules/order/orderMerge.js'
      - 'src/modules/order/orderStatusNormalization.contract.js'
      - 'src/modules/order/paymentState.service.js'
      - 'src/modules/ops/campaignCommissions.js'
      - 'src/modules/networkOps/campaignCommissionSummary.contract.js'
      - 'test/admitadAdapter.test.js'
      - 'test/campaignCommissions.test.js'
      - 'test/clientCommercialMatcher.test.js'
      - 'test/clientCommercialCalculation.test.js'
      - 'test/clientCommercialRuntime.service.test.js'
      - 'test/clientCommercialSchemas.test.js'
      - 'test/financeSeparation.test.js'
      - 'test/networkRegistryCoverage.test.js'
      - 'test/orderStatusApprovalSafety.test.js'
      - 'test/paymentStateFinanceSafety.test.js'
      - 'test/reconciliationEvidenceSafety.test.js'
      - 'test/reconciliationLogic.test.js'
      - 'test/p40.campaignCommissionSummary.test.js'
      - 'test/supplierCommissionArchitecture.contract.test.js'
      - 'test/supplierCommissionMatcher.test.js'
      - 'test/supplierCommissionRule.test.js'
      - 'test/supplierCommissionRuleService.test.js'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260902010000_supplier_commission_conditions/**'
      - 'prisma/migrations/20260902170000_client_commercial_runtime/**'
      - '.github/workflows/commission-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mbo_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/mbo_ci
      BACKEND_URL: http://127.0.0.1:3001
      FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run supplier commission architecture tests
        run: node --test test/supplierCommissionArchitecture.contract.test.js
      - name: Run supplier commission matcher tests
        run: node --test test/supplierCommissionMatcher.test.js
      - name: Run supplier commission rule tests
        run: node --test test/supplierCommissionRule.test.js
      - name: Run supplier commission history service tests
        run: node --test test/supplierCommissionRuleService.test.js
      - name: Run campaign commission current-window tests
        run: node --test test/campaignCommissions.test.js
      - name: Run campaign commission summary contract tests
        run: node --test test/p40.campaignCommissionSummary.test.js
      - name: Run client commercial matcher tests
        run: node --test test/clientCommercialMatcher.test.js
      - name: Run client commercial calculation tests
        run: node --test test/clientCommercialCalculation.test.js
      - name: Run client commercial persisted runtime tests
        run: node --test test/clientCommercialRuntime.service.test.js
      - name: Run client commercial API schema tests
        run: node --test test/clientCommercialSchemas.test.js
      - name: Run finance separation tests
        run: node --test test/financeSeparation.test.js
      - name: Run reconciliation contract tests
        run: node --test test/reconciliationLogic.test.js
      - name: Run reconciliation evidence safety tests
        run: node --test test/reconciliationEvidenceSafety.test.js
      - name: Run client payable finance chain tests
        run: node --test test/paymentStateFinanceSafety.test.js
      - name: Run order status approval safety tests
        run: node --test test/orderStatusApprovalSafety.test.js
      - name: Run nine-network registry coverage tests
        run: node --test test/networkRegistryCoverage.test.js
      - name: Run Admitad adapter contract tests
        run: node --test test/admitadAdapter.test.js
