name: Network Status and Reconciliation PR4

on:
  push:
    branches:
      - fix/network-status-reconciliation-pr4
    paths:
      - 'src/modules/order/orderStatusNormalization.contract.js'
      - 'src/modules/finance/reconciliation.service.js'
      - 'src/modules/finance/reconciliationLogic.contract.js'
      - 'src/modules/reporting/services/conversionPromotion.service.js'
      - 'test/orderStatusNormalization.test.js'
      - 'test/reconciliationLogic.test.js'
      - 'test/financeSeparation.test.js'
      - '.github/workflows/network-status-reconciliation-pr4.yml'
  pull_request:
    paths:
      - 'src/modules/order/orderStatusNormalization.contract.js'
      - 'src/modules/finance/reconciliation.service.js'
      - 'src/modules/finance/reconciliationLogic.contract.js'
      - 'src/modules/reporting/services/conversionPromotion.service.js'
      - 'test/orderStatusNormalization.test.js'
      - 'test/reconciliationLogic.test.js'
      - 'test/financeSeparation.test.js'
      - '.github/workflows/network-status-reconciliation-pr4.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source-scoped status normalization tests
        run: node --test test/orderStatusNormalization.test.js

      - name: Run reconciliation source-integrity tests
        run: node --test test/reconciliationLogic.test.js

      - name: Run finance separation regression tests
        run: node --test test/financeSeparation.test.js

      - name: Run supplier commission matcher regression tests
        run: node --test test/supplierCommissionMatcher.test.js
